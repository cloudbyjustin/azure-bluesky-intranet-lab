<svg width="1100" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#f5f5f5; stroke:#333; stroke-width:1.5; }
    .title { font-family:Segoe UI, Arial; font-size:16px; font-weight:bold; }
    .text { font-family:Segoe UI, Arial; font-size:13px; }
    .label { font-family:Segoe UI, Arial; font-size:12px; font-style:italic; }
    .arrow { stroke:#333; stroke-width:1.5; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Region -->
  <rect x="50" y="40" width="1000" height="600" class="box" fill="#e8f2ff"/>
  <text x="70" y="70" class="title">Azure Region: East US</text>

  <!-- VNet -->
  <rect x="80" y="100" width="940" height="480" class="box" fill="#ffffff"/>
  <text x="100" y="130" class="title">Virtual Network: vnet-bluesky (10.0.0.0/16)</text>

  <!-- subnet-web -->
  <rect x="110" y="170" width="380" height="200" class="box" fill="#fdfdfd"/>
  <text x="125" y="195" class="text">subnet-web (10.0.1.0/24)</text>
  <text x="125" y="215" class="label">NSG: nsg-web</text>

  <!-- Load Balancer -->
  <rect x="140" y="230" width="180" height="80" class="box" fill="#eef7ff"/>
  <text x="150" y="255" class="text">Load Balancer: lb-web</text>
  <text x="150" y="275" class="label">Frontend: pip-lb-web</text>

  <!-- VM -->
  <rect x="340" y="230" width="130" height="80" class="box" fill="#eef7ff"/>
  <text x="350" y="255" class="text">VM: vm-web01</text>
  <text x="350" y="275" class="label">Ubuntu + NGINX</text>
  <text x="350" y="295" class="label">NIC: nic-web01</text>

  <!-- Arrow LB -> VM -->
  <line x1="320" y1="270" x2="340" y2="270" class="arrow" />

  <!-- subnet-mgmt -->
  <rect x="520" y="170" width="220" height="120" class="box" fill="#fdfdfd"/>
  <text x="535" y="195" class="text">subnet-mgmt (10.0.2.0/24)</text>
  <text x="535" y="215" class="label">NSG: nsg-mgmt</text>

  <!-- AzureBastionSubnet -->
  <rect x="520" y="310" width="220" height="120" class="box" fill="#fdfdfd"/>
  <text x="535" y="335" class="text">AzureBastionSubnet (10.0.3.0/27)</text>

  <!-- Bastion -->
  <rect x="550" y="350" width="160" height="60" class="box" fill="#eef7ff"/>
  <text x="560" y="375" class="text">Azure Bastion</text>
  <text x="560" y="395" class="label">Public IP: pip-bastion</text>

  <!-- Internet -->
  <rect x="110" y="420" width="150" height="60" class="box" fill="#fff7e6"/>
  <text x="120" y="445" class="text">Internet</text>

  <!-- Arrow Internet -> LB -->
  <line x1="185" y1="420" x2="230" y2="310" class="arrow" />

  <!-- Arrow Bastion -> VM (admin path) -->
  <line x1="630" y1="350" x2="405" y2="310" class="arrow" />

  <!-- Storage Account -->
  <rect x="780" y="220" width="220" height="100" class="box" fill="#f5faff"/>
  <text x="795" y="245" class="text">Storage Account: stblueskylogs</text>
  <text x="795" y="265" class="label">Boot diagnostics & logs</text>

  <!-- Arrow VM -> Storage -->
  <line x1="470" y1="270" x2="780" y2="270" class="arrow" />

  <!-- Legend -->
  <rect x="780" y="360" width="220" height="180" class="box" fill="#ffffff"/>
  <text x="795" y="385" class="title">Legend</text>
  <text x="800" y="410" class="text">Blue boxes: Azure resources</text>
  <text x="800" y="430" class="text">Grey boxes: Subnets / VNet</text>
  <text x="800" y="450" class="text">Orange box: Internet</text>
  <text x="800" y="470" class="text">Arrows: Traffic / access paths</text>
</svg>
